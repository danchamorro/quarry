[package]
name = "quarry-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Enables deterministic test instrumentation (e.g., edit-snapshot byte counters
# and worker peak counters) for downstream crate test suites without polluting
# release builds.
test-hooks = []

[dependencies]
quarry-core = { path = "../quarry-core" }
tempfile = "3.27.0"

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
