name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep full ThinLTO + single codegen unit on `main` pushes; use faster
  # parallel release compilation on pull requests to avoid 15-20 min runs.
  CARGO_PROFILE_RELEASE_LTO: ${{ github.event_name == 'pull_request' && 'off' || 'thin' }}
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.event_name == 'pull_request' && '16' || '1' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Push event — running full CI."
            exit 0
          fi

          if ! files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Could not list PR files — defaulting to full CI."
            exit 0
          fi

          if [[ -z "$files" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Empty PR file list — defaulting to full CI."
            exit 0
          fi

          code_changed=false
          file_count=0
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            file_count=$((file_count + 1))
            if [[ ! "$path" =~ ^(docs/|README\.md$|CHANGELOG\.md$|\.github/ISSUE_TEMPLATE/) ]]; then
              code_changed=true
              echo "Non-doc change detected: $path"
              break
            fi
          done <<< "$files"

          # GitHub's PR files endpoint caps at 3000 entries; fail safe to full CI.
          if (( file_count >= 3000 )); then
            code_changed=true
            echo "PR touched >= 3000 files — defaulting to full CI."
          fi

          echo "code=${code_changed}" >> "$GITHUB_OUTPUT"
          if [[ "$code_changed" == "false" ]]; then
            echo "Docs-only PR — skipping Rust build and test matrix."
          fi

  test:
    needs: [detect-changes]
    runs-on: macos-latest
    steps:
      - name: Skip Rust checks on docs-only PR
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "Docs-only PR — required CI/test check satisfied without Rust builds."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.detect-changes.outputs.code == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        if: needs.detect-changes.outputs.code == 'true'
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.detect-changes.outputs.code == 'true'
        with:
          key: ${{ github.event_name == 'pull_request' && 'pr-fast' || 'main-lto' }}
          cache-on-failure: true
      - name: Record host architecture and target
        id: host
        if: needs.detect-changes.outputs.code == 'true'
        run: |
          uname -sm
          rustc -vV
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          echo "target=${host_target}" >> "$GITHUB_OUTPUT"
      - if: needs.detect-changes.outputs.code == 'true'
        run: cargo fmt --all -- --check
      - if: needs.detect-changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: needs.detect-changes.outputs.code == 'true'
        run: cargo test --workspace --all-features --locked
      - name: Build non-GPUI workspace crates (release)
        if: needs.detect-changes.outputs.code == 'true'
        run: cargo build --release --locked --target "${{ steps.host.outputs.target }}" -p quarry-core -p quarry-delimited -p quarry-workbench -p quarry-cli -p quarry-appkit
      - if: needs.detect-changes.outputs.code == 'true'
        run: ./scripts/macos-app.sh self-test
      - if: needs.detect-changes.outputs.code == 'true'
        run: ./scripts/linux-app.sh self-test
      - if: needs.detect-changes.outputs.code == 'true'
        run: ./scripts/generate-notices.sh --release-check --all-targets
      - name: Build and verify macOS app bundle (GPUI release)
        if: needs.detect-changes.outputs.code == 'true'
        run: |
          ./scripts/macos-app.sh package
          rm -rf target/package

  linux-core-cli:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ github.event_name == 'pull_request' && 'pr-fast' || 'main-lto' }}
          cache-on-failure: true
      - name: Record host architecture
        run: |
          uname -sm
          rustc -vV
      - run: cargo clippy -p quarry-core -p quarry-delimited -p quarry-cli -p quarry-workbench --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p quarry-core -p quarry-delimited -p quarry-cli -p quarry-workbench --all-features --locked
      - run: cargo build -p quarry-core -p quarry-delimited -p quarry-cli -p quarry-workbench --release --locked

  linux-arm64-core-cli:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ github.event_name == 'pull_request' && 'pr-fast' || 'main-lto' }}
          cache-on-failure: true
      - name: Record host architecture
        run: |
          uname -sm
          rustc -vV
      - run: cargo clippy -p quarry-core -p quarry-delimited -p quarry-cli -p quarry-workbench --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p quarry-core -p quarry-delimited -p quarry-cli -p quarry-workbench --all-features --locked
      - run: cargo build -p quarry-core -p quarry-delimited -p quarry-cli -p quarry-workbench --release --locked

  macos-intel-core-cli:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ github.event_name == 'pull_request' && 'pr-fast' || 'main-lto' }}
          cache-on-failure: true
      - name: Record host architecture
        run: |
          uname -sm
          rustc -vV
      - run: cargo clippy -p quarry-core -p quarry-delimited -p quarry-cli -p quarry-workbench --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p quarry-core -p quarry-delimited -p quarry-cli -p quarry-workbench --all-features --locked
      - run: cargo build -p quarry-core -p quarry-delimited -p quarry-cli -p quarry-workbench --release --locked

  windows-core:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ github.event_name == 'pull_request' && 'pr-fast' || 'main-lto' }}
          cache-on-failure: true
      - name: Record host architecture
        shell: pwsh
        run: |
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          rustc -vV
      - run: cargo test -p quarry-core --locked windows_
      - run: cargo test -p quarry-core --locked pinned_publication_reports_cleanup_failure
      - run: cargo test -p quarry-core --locked publication_wrappers_keep_primary_errors_and_staging_cleanup_context
      - run: cargo test -p quarry-core --locked duplicate_uniqueness_diagnostic_uses_each_inputs_header_record_offset
      - run: cargo test -p quarry-core --locked spill::tests
      - run: cargo test -p quarry-core --locked pool::tests
      - run: cargo test -p quarry-core --locked storage::tests
      - run: cargo test -p quarry-core --locked join::working::tests
      - run: cargo test -p quarry-core --locked working_storage::tests
      - run: cargo test -p quarry-core --locked sidecar::tests
      - run: "cargo test -p quarry-core --locked join_faults::"
      - run: cargo test -p quarry-workbench --locked
      - run: cargo build -p quarry-core -p quarry-delimited -p quarry-workbench --release --locked
