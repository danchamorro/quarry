name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - name: Record host architecture
        run: |
          uname -sm
          rustc -vV
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: ./scripts/macos-app.sh self-test
      - run: ./scripts/macos-app.sh package

  linux-core-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Record host architecture
        run: |
          uname -sm
          rustc -vV
      - run: cargo clippy -p quarry-core -p quarry-delimited -p quarry-cli --all-targets --locked -- -D warnings
      - run: cargo test -p quarry-core -p quarry-delimited -p quarry-cli --locked
      - run: cargo build -p quarry-core -p quarry-delimited -p quarry-cli --release --locked

  linux-arm64-core-cli:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Record host architecture
        run: |
          uname -sm
          rustc -vV
      - run: cargo clippy -p quarry-core -p quarry-delimited -p quarry-cli --all-targets --locked -- -D warnings
      - run: cargo test -p quarry-core -p quarry-delimited -p quarry-cli --locked
      - run: cargo build -p quarry-core -p quarry-delimited -p quarry-cli --release --locked

  macos-intel-core-cli:
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Record host architecture
        run: |
          uname -sm
          rustc -vV
      - run: cargo clippy -p quarry-core -p quarry-delimited -p quarry-cli --all-targets --locked -- -D warnings
      - run: cargo test -p quarry-core -p quarry-delimited -p quarry-cli --locked
      - run: cargo build -p quarry-core -p quarry-delimited -p quarry-cli --release --locked

  windows-core:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Record host architecture
        shell: pwsh
        run: |
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          rustc -vV
      - run: cargo test -p quarry-core --locked windows_
      - run: cargo test -p quarry-core --locked pinned_publication_reports_cleanup_failure
      - run: cargo test -p quarry-core --locked publication_wrappers_keep_primary_errors_and_staging_cleanup_context
      - run: cargo test -p quarry-core --locked duplicate_uniqueness_diagnostic_uses_each_inputs_header_record_offset
      - run: cargo test -p quarry-core --locked spill::tests
      - run: cargo test -p quarry-core --locked join::working::tests
      - run: cargo test -p quarry-core --locked working_storage::tests
      - run: cargo test -p quarry-core --locked sidecar::tests
      - run: "cargo test -p quarry-core --locked join_faults::"
      - run: cargo build -p quarry-core -p quarry-delimited --release --locked
