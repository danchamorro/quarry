[workspace]
members = [
    "apps/quarry-cli",
    "crates/quarry-core",
    "crates/quarry-delimited",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
memchr = "2.7"

[profile.release]
codegen-units = 1
lto = "thin"
