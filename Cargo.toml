[workspace]
members = [
    "apps/quarry-appkit",
    "apps/quarry-cli",
    "apps/quarry-gpui",
    "crates/quarry-core",
    "crates/quarry-delimited",
    "crates/quarry-workbench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.100"

[workspace.dependencies]
memchr = "2.7"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "AppKitDefines", "NSAppearance", "NSApplication", "NSButton", "NSColor", "NSControl", "NSFont", "NSGraphics", "NSProgressIndicator", "NSResponder", "NSRunningApplication", "NSScrollView", "NSText", "NSTextContainer", "NSTextField", "NSTextView", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSNotification", "NSObject", "NSString", "NSTimer"] }

[profile.release]
codegen-units = 1
lto = "thin"

# Temporary patch for `gpui-pre-macos 0.3.12`: fall back to CVDisplayLink on
# Apple Silicon paravirtualized Metal devices (`Apple Paravirtual device`),
# where `CAMetalDisplayLink` stalls while the pointer is stationary
# (https://github.com/zed-industries/zed/issues/67295). Remove once an upstream
# `gpui-pre-macos` / `gpui-kit` release includes this fix.
[patch.crates-io]
gpui-pre-macos = { git = "https://github.com/danchamorro/gpui-pre-macos.git", rev = "7e0297f71d5d6ee878b55cdd4616deb9a529df41" }
